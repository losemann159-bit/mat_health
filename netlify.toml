[build]
  command = "node build.mjs"
  publish = "dist"

[[redirects]]
  from = "/api/workouts"
  to = "/journal.json"
  status = 200

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/workouts"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
